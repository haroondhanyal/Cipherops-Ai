services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cipherops
      POSTGRES_USER: cipherops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cipherops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipherops -d cipherops"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cipherops-postgres:
